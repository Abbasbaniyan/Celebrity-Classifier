<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CelebLens AI</title>

    <link rel="stylesheet" href="app.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="aurora"></div>
<nav class="navbar">

    <div class="brand">

        <i class="fa-solid fa-brain"></i>

        <span>CelebLens AI</span>

    </div>

    <a href="https://github.com/Abbasbaniyan" target="_blank">

        <i class="fa-brands fa-github"></i>

        GitHub

    </a>

</nav>

<div class="wrapper">

<div class="hero">

<!-- <div class="logo">

<i class="fa-solid fa-sparkles"></i>

<span>CelebLens AI</span>

</div> -->

<h1>

Recognize Any Celebrity

<span>Using Artificial Intelligence</span>

</h1>

<p>

Upload an image and let the AI identify the celebrity within seconds.

</p>

</div>


<div class="glass-card">

<div class="upload-box" id="dropArea">

<input type="file" id="fileInput" hidden accept="image/*">

<i class="fa-solid fa-cloud-arrow-up"></i>

<h3>Upload Celebrity Image</h3>

<p>
Drag & Drop your image here<br>
or <strong>browse</strong> from your device
</p>

<span class="file-type">
JPG • PNG • WEBP
</span>

</div>


Upload Box

<div class="prediction-container">

    <div class="preview">
        <img id="previewImage">
    </div>

    

</div>

<button id="predictBtn">
    <i class="fa-solid fa-wand-magic-sparkles"></i>
    Analyze Image
</button>

<div class="loader" id="loader">

<div class="spinner"></div>

<p>AI is thinking...</p>

</div>


<div class="result-card" id="resultCard">

<h2 id="celebName">

Celebrity Name

</h2>

<div class="percent">

<span id="confidence">

95%

</span>

</div>

<div class="progress">

<div class="progress-bar" id="progressBar"></div>

</div>

</div>

</div>

</div>

<script src="app.js"></script>

</body>

</html>
